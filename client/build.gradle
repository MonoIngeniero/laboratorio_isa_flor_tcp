apply plugin: 'application'

application {
    mainClass = 'co.icesi.buscaminas.client.MainClient'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'co.icesi.buscaminas.client.MainClient',
                'Class-Path': configurations.runtimeClasspath.resolve().collect { it.toURI() }.join(' ')
        )
    }
}

tasks.named('run') {
    standardInput = System.in
}